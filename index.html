<style>

.tk{font-weight:800;font-size:20px;line-height:1.2}.tk span{display:block;font-weight:600;color:var(--mut);font-size:15px}

.grid b small{font-size:15px}
.bar{height:9px;background:#262a36;border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px}.bar u{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:#fff8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{white-space:normal}
.sec{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.strip{display:flex;flex-direction:column;gap:8px}
.mo-d summary{list-style:none;cursor:pointer}.mo-d summary::-webkit-details-marker{display:none}.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;margin:4px 0 0 12px;border-left:2px solid var(--line);font-size:15px}.tx b{font-size:16px}
.mo{display:flex;align-items:baseline;gap:10px;background:var(--card);border-radius:12px;padding:10px 14px}
.mo .lbl{flex:1}.mo b{font-size:20px}.mo span.m{font-size:15px!important}
.ev{display:flex;flex-direction:column;gap:6px}
.e{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;border-left:4px solid}
.e .d{font-weight:800;width:62px;flex:none}.e .t{flex:1}
.ft{text-align:center;font-size:13px;color:#6c7283;padding-top:4px}
</style></head><body>

<script>
/* ===== EVENTS (manual edits) =====
   Base events live in data.json -> "events". Add/override here: {date:'YYYY-MM-DD', tag:'2-3 words', tk:'TSLA'|'SPCX', note:'est'|'NET'|'AMC', catalyst:true}
   catalyst:true => counts for the "through event" chip on positions expiring after it. */
const EVENTS = [
];
/* ================================== */
const C={TSLA:'#E31937',SPCX:'#3B82F6'};
let DATA=JSON.parse(document.getElementById('wheel-data').textContent||'{}');
const $=id=>document.getElementById(id);
const nz=v=>v!==null&&v!==undefined&&!isNaN(v);
const usd=(v,s)=>nz(v)?(s&&v>0?'+':v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0}):'—';
const f2=v=>nz(v)?v.toFixed(2):'—';
const pct=(v,s)=>nz(v)?(s&&v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+'%':'—';
const cls=v=>!nz(v)?'m':v>0?'g':v<0?'r':'';
const day=s=>new Date(s+'T12:00:00');
function today(){const t=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));t.setHours(12,0,0,0);return t}
const dte=e=>Math.round((day(e)-today())/864e5);
const md=s=>day(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
function render(){
 const D=DATA,mk=D.market||{},evs=[...(D.events||[]),...EVENTS].sort((a,b)=>a.date.localeCompare(b.date));
 let tot=0,ok=true,res=0;
 $('cards').innerHTML=(D.positions||[]).map(p=>{
  const m=mk[p.ticker]||{},spot=m.spot,mark=p.mark,cr=p.credit,q=p.qty;
  const pl=nz(mark)?(cr-mark)*100*q:null; if(nz(pl))tot+=pl;else ok=false; res+=p.strike*100*q;
  const chg=nz(mark)?mark-cr:null,chgp=nz(mark)?(mark/cr-1)*100:null,cap=nz(mark)?(1-mark/cr)*100:null;
  const d=dte(p.exp),age=-dte(p.opened),be=p.strike-cr,dist=nz(spot)?(spot/p.strike-1)*100:null;
  const tg=age<=7?50:80,tf=1-tg/100;const amb=d<=25||(nz(cap)&&cap>=tg);
  const ch=[];
  if(nz(mark)&&mark<=cr*tf)ch.push([tg+'% HIT','c-g']);else if(nz(mark)&&mark<=cr*(tf+.05))ch.push(['near '+tg+'%','c-a']);else ch.push(['target '+tg+'% · $'+(cr*tf).toFixed(2),'c-b']);
  if(d<=25)ch.push(['exit window','c-a']);
  const thr=evs.filter(e=>e.catalyst&&e.date>=today().toISOString().slice(0,10)&&e.date<=p.exp&&(!e.tk||e.tk===p.ticker));
  if(thr.length)ch.push(['thru '+thr.map(e=>(e.short||e.tag)+(e.note==='est'?' est':e.note==='calc'?' calc':'')).join(' · '),'c-b']);
  if(nz(dist)&&dist<0)ch.push(['ITM','c-r']);
  const barc=!nz(cap)?'#444':cap<0?'var(--r)':cap>=tg?'var(--a)':'var(--g)';
  return `<div class="card ${amb?'amb':''}" style="border-color:${C[p.ticker]}">
  <div class="top"><div class="tk" style="color:${C[p.ticker]}">${p.ticker}<span>${p.strike}P · ${md(p.exp)}${' · '+(nz(p.qty)?p.qty+'×':'—')}</span></div>
   <div><div class="pl n ${cls(pl)}">${usd(pl,1)}</div><div class="lbl n" style="margin-top:2px">Reserved <b style="color:var(--tx);font-size:1.25em">${nz(p.qty)?usd(p.strike*100*p.qty):'—'}</b></div></div></div>
  <div class="grid n">
   <div><span class="lbl">Spot</span><b>${f2(spot)}</b></div>
   <div><span class="lbl">Open @</span><b>${f2(p.open_under)}</b></div>
   <div><span class="lbl">Age</span><b>${age}d</b></div>
   <div><span class="lbl">DTE</span><b class="${d<=25?'a':''}">${d}d</b></div>
   <div><span class="lbl">Credit→Mark</span><b>${f2(cr)}→${f2(mark)}</b></div>
   <div><span class="lbl">Δ $ / %</span><b class="${cls(-chg)}">${nz(chg)?(chg>0?'+':'−')+Math.abs(chg).toFixed(2):'—'} <small>${pct(chgp,1)}</small></b></div>
   <div><span class="lbl">Breakeven</span><b>${f2(be)}</b></div>
   <div><span class="lbl">To strike</span><b class="${cls(dist)}">${pct(dist,1)}</b></div>
   <div><span class="lbl">Max kept</span><b class="${amb&&cap>=50?'a':cls(cap)}">${pct(cap)}</b></div>
  </div>
  <div class="bar"><i style="width:${nz(cap)?Math.max(0,Math.min(100,cap)):0}%;background:${barc}"></i><u style="left:${tg}%"></u></div>
  <div class="chips">${ch.map(c=>`<span class="chip ${c[1]}">${c[0]}</span>`).join('')||'<span class="chip c-m">hold zone</span>'}</div></div>`}).join('');
 $('tpl').textContent=ok?usd(tot,1):'—';$('tpl').className='big n '+(ok?cls(tot):'m');
 $('res').textContent=usd(res);
 const r=D.refreshed_utc?new Date(D.refreshed_utc):null;
 $('ts').textContent=r?r.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET':'—';
 $('ivrow').innerHTML=Object.keys(C).map(t=>{const a=(mk[t]||{}).atm,iv=a?a.iv:null,rk=(mk[t]||{}).iv_rank;
  return `<div class="iv n" style="border-color:${C[t]}"><span class="lbl" style="color:${C[t]};width:100%">${t} ATM IV</span><b class="${nz(iv)&&iv<50?'a':''}">${nz(iv)?iv.toFixed(1)+'%':'—'}</b><span class="lbl">Rk ${nz(rk)?rk:'—'}</span>${nz(iv)&&iv<50?'<span class="chip c-a">PREF IV MISSED</span>':''}</div>`}).join('');
 // monthly from closed trades
 const cl=D.closed||[],mons={};const st=new Date(2026,9,1),now=today();
 for(let d=new Date(st);d<=now;d.setMonth(d.getMonth()+1))mons[d.toISOString().slice(0,7)]=0;
 cl.forEach(c=>{const k=c.closed.slice(0,7);mons[k]=(mons[k]||0)+(c.credit-(c.debit??c.close_debit))*100*c.qty});
 const base=res||1;let ytd=0;
 const mh=Object.entries(mons).reverse().map(([k,v])=>{ytd+=v;const tx=cl.filter(c=>c.closed.slice(0,7)===k).sort((a,b)=>b.closed.localeCompare(a.closed));
  const rows=tx.map(c=>{const db=c.debit??c.close_debit,r=(c.credit-db)*100*c.qty;return `<div class="tx n"><div><b>${c.ticker} ${c.strike}P ${md(c.exp)} · ${c.qty}×</b><br><span class="lbl">Sold ${md(c.opened)} @ ${f2(c.credit)} · Closed ${md(c.closed)} @ ${f2(db)}</span></div><b class="${cls(r)}">${usd(r)}</b></div>`}).join('')||'<div class="tx lbl">No closed trades yet</div>';
  return `<details class="mo-d"><summary class="mo n"><div class="lbl">${day(k+'-15').toLocaleDateString('en-US',{month:'short',year:'numeric'})} · ${tx.length} ▾</div><b class="${cls(v)}">${usd(v)}</b> <span class="m" style="font-size:11px">${pct(v/base*100)}</span></summary>${rows}</details>`});
 mh.unshift(`<div class="mo n" style="border:1px solid var(--line)"><div class="lbl">Since Oct 1 · ${cl.length} closed</div><b class="${cls(ytd)}">${usd(ytd)}</b> <span class="m" style="font-size:11px">${pct(ytd/base*100)}</span></div>`);
 $('months').innerHTML=mh.join('');{const ck=now.toISOString().slice(0,7),cv=mons[ck]||0;$('mlbl').textContent=now.toLocaleDateString('en-US',{month:'long'})+' income';$('mtd').textContent=usd(cv);$('mtd').className='big n '+cls(cv);$('mgp').textContent=Math.round(cv/40)+'%';}$('msrc').textContent='src: '+(D.monthly_source||'—');
 const t0=today(),lim=new Date(t0.getTime()+45*864e5);
 $('events').innerHTML=evs.filter(e=>day(e.date)>=t0&&day(e.date)<=lim).map(e=>`<div class="e" style="border-color:${C[e.tk]||'#888'}"><span class="d n">${md(e.date)}</span><span class="t">${e.tag}</span>${e.note?`<span class="chip ${e.note==='est'||e.note==='NET'||e.note==='reported'||e.note==='calc'?'c-a':'c-m'}">${e.note==='reported'?'rptd':e.note}</span>`:''}${e.exp?'<span class="chip c-m">exp</span>':''}</div>`).join('');
}
render();
function postH(){try{window.parent.postMessage({wtHeight:document.body.scrollHeight},'*')}catch(e){}}
addEventListener('load',postH);addEventListener('resize',postH);new ResizeObserver(postH).observe(document.body);setTimeout(postH,500);
// When hosted: try fresh data.json (falls back silently to embedded data when opened as file)
if(location.protocol.startsWith('http')){fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{DATA=j;render();postH()}).catch(()=>{});
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
